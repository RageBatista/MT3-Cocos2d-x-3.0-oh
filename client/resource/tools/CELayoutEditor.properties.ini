[GroupNames]
Layout=Layout
Visual=Visual
Image=Image
Text=Text
Lua=Lua
Anim=Anim/Effect
Other=Other

[GroupTooltips]
Layout=布局/排版：位置、尺寸、间距、行列等常用属性
Visual=显示：可见性、透明度、颜色、层级、裁剪等
Image=图片：Image/NormalImage/HoverImage/... 以及 ImageSetName/ImageName
Text=文本：Text/Font/格式/颜色等
Lua=Lua：LuaClass/LuaMemberName/LuaEventOnClicked 等脚本绑定
Anim=动画/特效：动画/过渡/特效相关（项目自定义）
Other=未分类：暂未归类的属性

[PropertyTooltips]
Name=控件名称（CEGUI Window Name）。建议全局唯一；批量改名会影响 LuaMemberName 的约定请自查。
Visible=是否可见。
Alpha=透明度（0~1）。
AlwaysOnTop=置顶显示/输入优先（视控件实现）。
ClippedByParent=超出父窗口区域时裁剪。
MousePassThroughEnabled=鼠标穿透：不接收鼠标事件。
ReadOnly=只读状态：控件不响应编辑/输入（视控件实现）。
DraggingEnabled=允许拖拽（视控件实现）。
SizingEnabled=允许拉伸/缩放（视控件实现）。
InheritsAlpha=是否继承父窗口透明度。
InheritsTooltipText=是否继承父窗口 Tooltip 文本。
Tooltip=控件 Tooltip 文本（鼠标悬停提示）。

XPos=位置 X（常用）。
YPos=位置 Y（常用）。
Width=宽度（常用）。
Height=高度（常用）。
LeftScale=左边 UDim.Scale（0~1，相对父尺寸）。
LeftOffset=左边 UDim.Offset（像素偏移）。
TopScale=上边 UDim.Scale（0~1）。
TopOffset=上边 UDim.Offset（像素偏移）。
RightScale=右边 UDim.Scale（0~1）。
RightOffset=右边 UDim.Offset（像素偏移）。
BottomScale=下边 UDim.Scale（0~1）。
BottomOffset=下边 UDim.Offset（像素偏移）。

Image=图片引用（常见格式：set:xxx image:yyy）。可用“换资源...”选择器辅助填写。
NormalImage=普通状态图片。
HoverImage=悬停状态图片。
PushedImage=按下状态图片。
DisabledImage=禁用状态图片。
ImageSetName=图片集名称（配合 ImageName）。
ImageName=图片名称（配合 ImageSetName）。
ImageSizeEnable=是否按图片原始尺寸影响绘制/布局（项目约定）。

Text=显示文本（若控件支持）。
Font=字体资源名。
TitlebarFont=标题栏字体资源名（若控件支持）。
TextParsingEnabled=是否启用文本解析（富文本/颜色标签等，项目约定）。
LineSpace=行间距。
MaxTextLength=最大字符数（0 表示不限制，视控件实现）。

NormalTextColour=普通状态文字颜色。
HoverTextColour=悬停状态文字颜色。
PushedTextColour=按下状态文字颜色。
DisabledTextColour=禁用状态文字颜色。
SelectedTextColour=选中状态文字颜色（若控件支持）。
ActiveSelectionColour=选中背景颜色（若控件支持）。
InactiveSelectionColour=未选中背景颜色（若控件支持）。

LuaMemberName=Lua 绑定名称（界面内建议唯一，用于脚本查找/事件派发）。
LuaClass=Lua 类/脚本类名（项目 Lua 侧解析）。
LuaEventOnClicked=点击事件回调名/事件名（项目 Lua 侧解析）。
LuaForDialog=是否作为 Dialog（影响脚本/生命周期，项目约定）。

