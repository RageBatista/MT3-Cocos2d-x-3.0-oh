server {
    listen 88;
    server_name _;

    root /www/wwwroot/web_app/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Dynamic ThinkPHP multi-app entrypoints. Keep these before static/deny
    # regex locations so client SDK/API requests never fall through to nginx 404.
    location ^~ /api/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /player/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ^~ /agent/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-80.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~ /(app|config|route|runtime|vendor|database)/ {
        deny all;
    }

    access_log /www/wwwlogs/web_app_access.log;
    error_log  /www/wwwlogs/web_app_error.log;
}
