{extend name="layout/login" /}

{block name="title"}忘记密码 - 玩家服务中心{/block}

{block name="header"}
<div class="lyear-panel-header" style="background: linear-gradient(135deg, #faa64b 0%, #f96197 100%);">
    <h3><i class="mdi mdi-lock-reset"></i> 忘记密码</h3>
    <p>输入账号和邮箱找回密码</p>
</div>
{/block}

{block name="content"}
<form id="forgotForm" method="post" action="/player/auth/doForgot">
    <input type="hidden" name="csrf_token" value="{$csrf_token|default=''}">

    <div class="form-group">
        <label class="form-label">
            <i class="mdi mdi-account"></i> 账号
        </label>
        <input type="text" class="form-control" name="username" placeholder="请输入您的账号" required>
    </div>

    <div class="form-group">
        <label class="form-label">
            <i class="mdi mdi-email"></i> 邮箱
        </label>
        <input type="email" class="form-control" name="email" placeholder="请输入注册时绑定的邮箱" required>
        <div class="form-hint">重置链接将发送到此邮箱</div>
    </div>

    <div class="form-group">
        <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="mdi mdi-send"></i> 发送重置链接
        </button>
    </div>
</form>
{/block}

{block name="footer"}
<div class="lyear-panel-footer">
    <a href="/player/auth/login"><i class="mdi mdi-arrow-left"></i> 返回登录</a>
</div>
{/block}

{block name="script"}
<script>
    ajaxSubmit('#forgotForm');
</script>
{/block}
