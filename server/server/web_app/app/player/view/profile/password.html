{extend name="layout/base" /}

{block name="title"}修改密码 - 玩家服务中心{/block}
{block name="page_title"}修改密码{/block}

{block name="content"}
<div class="card">
    <div class="card-header">
        <h3 class="card-title"><i class="mdi mdi-lock-reset"></i> 修改密码</h3>
        <a href="/player/profile" class="btn btn-sm btn-outline-primary" style="margin-left: auto;">
            <i class="mdi mdi-arrow-left"></i> 返回个人中心
        </a>
    </div>
    <div class="card-body">
        <form id="passwordForm" method="post" action="/player/profile/updatePassword">
            <input type="hidden" name="csrf_token" value="{$csrf_token}">

            <div class="form-group">
                <label class="form-label"><i class="mdi mdi-lock"></i> 原密码</label>
                <input type="password" class="form-control" name="old_password" placeholder="请输入原密码" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="mdi mdi-lock-plus"></i> 新密码</label>
                <input type="password" class="form-control" name="new_password" placeholder="6-18位字母+数字" required>
                <small class="text-muted">密码必须包含字母和数字，长度6-18位</small>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="mdi mdi-lock-check"></i> 确认新密码</label>
                <input type="password" class="form-control" name="confirm_password" placeholder="请再次输入新密码" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <i class="mdi mdi-content-save"></i> 提交修改
            </button>
        </form>
    </div>
</div>
{/block}

{block name="script"}
<script>
    ajaxSubmit('#passwordForm', {
        redirect: '/player/auth/login'
    });
</script>
{/block}
