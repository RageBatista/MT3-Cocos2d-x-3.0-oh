<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
<title>授权登录</title>
<link rel="shortcut icon" type="image/x-icon" href="__MB__/favicon.ico">
<link rel="stylesheet" type="text/css" href="__MB__/css/materialdesignicons.min.css">
<link rel="stylesheet" type="text/css" href="__MB__/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="__MB__/css/style.min.css">
<link rel="stylesheet" type="text/css" href="__MB__/alert/sweetalert2.min.css">
<script src="__MB__/alert/sweetalert2.all.min.js"></script>
<style>
  :root {
    --tk-bg: #f3f6fb;
    --tk-card: #ffffff;
    --tk-border: #e6ebf2;
    --tk-text: #1f2937;
    --tk-subtext: #667085;
    --tk-primary: #1677ff;
    --tk-primary-soft: #eaf3ff;
    --tk-success: #16a34a;
    --tk-danger: #e11d48;
    --tk-warning: #f59e0b;
    --tk-radius-card: 14px;
    --tk-radius-control: 10px;
    --tk-space-1: 6px;
    --tk-space-2: 8px;
    --tk-space-3: 10px;
    --tk-space-4: 12px;
    --tk-space-5: 16px;
    --tk-space-6: 20px;
    --tk-space-8: 28px;
    --tk-btn-h: 44px;
    --tk-font-xs: 12px;
    --tk-font-sm: 13px;
    --tk-font-md: 15px;
    --tk-font-lg: 18px;
    --tk-font-xl: 22px;
    --tk-line-tight: 1.25;
    --tk-line-normal: 1.5;
    --tk-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }

  html, body {
    min-height: 100%;
    margin: 0;
    background: var(--tk-bg);
    color: var(--tk-text);
  }

  .page-wrap {
    max-width: 580px;
    margin: 0 auto;
    padding: var(--tk-space-5);
    padding-bottom: var(--tk-space-8);
  }

  .hero-card,
  .content-card {
    background: var(--tk-card);
    border: 1px solid var(--tk-border);
    border-radius: var(--tk-radius-card);
    box-shadow: var(--tk-shadow);
  }

  .hero-card {
    padding: var(--tk-space-5);
    margin-bottom: var(--tk-space-4);
  }

  .hero-title {
    margin: 0;
    font-size: var(--tk-font-xl);
    font-weight: 700;
    line-height: var(--tk-line-tight);
  }

  .hero-subtitle {
    margin: var(--tk-space-1) 0 0;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  .content-head {
    padding: var(--tk-space-4) var(--tk-space-5);
    border-bottom: 1px solid var(--tk-border);
    background: #fbfcff;
    font-size: var(--tk-font-sm);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: var(--tk-space-1);
  }

  .content-body {
    padding: var(--tk-space-5);
  }

  #msgBox {
    display: none;
    border-radius: var(--tk-radius-control);
    margin-bottom: var(--tk-space-3);
  }

  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--tk-space-2);
    margin-bottom: var(--tk-space-4);
  }

  .seg-btn {
    border: 1px solid var(--tk-border);
    background: #ffffff;
    color: var(--tk-text);
    border-radius: var(--tk-radius-control);
    min-height: calc(var(--tk-btn-h) - 2px);
    font-size: var(--tk-font-sm);
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .seg-btn.active {
    border-color: var(--tk-primary);
    background: var(--tk-primary-soft);
    color: var(--tk-primary);
  }

  .form-label {
    font-size: var(--tk-font-sm);
    font-weight: 600;
    margin-bottom: var(--tk-space-1);
  }

  .form-control,
  .form-select {
    min-height: var(--tk-btn-h);
    border-radius: var(--tk-radius-control);
    font-size: 16px;
  }

  .field-help {
    margin-top: var(--tk-space-1);
    margin-bottom: 0;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  .server-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--tk-space-2);
    align-items: end;
  }

  .reload-btn {
    min-height: var(--tk-btn-h);
    border-radius: var(--tk-radius-control);
    white-space: nowrap;
  }

  .submit-btn {
    width: 100%;
    min-height: var(--tk-btn-h);
    border-radius: var(--tk-radius-control);
    font-size: var(--tk-font-md);
    font-weight: 600;
  }

  .mode-tip {
    margin-top: var(--tk-space-2);
    margin-bottom: 0;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  .hide {
    display: none !important;
  }

  .foot-link {
    margin-top: var(--tk-space-3);
    text-align: center;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  @media (max-width: 380px) {
    .page-wrap {
      padding: var(--tk-space-3);
    }

    .server-row {
      grid-template-columns: 1fr;
    }

    .reload-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="page-wrap">
    <section class="hero-card">
      <h1 class="hero-title">梦幻授权登录</h1>
      <p class="hero-subtitle">移动端优先布局，统一后台风格，支持新授权与已有授权两种模式。</p>
    </section>

    <section class="content-card">
      <div class="content-head">
        <i class="mdi mdi-shield-check-outline"></i>
        玩家授权
      </div>

      <div class="content-body">
        <div id="msgBox" class="alert" role="alert"></div>

        <div class="segmented" id="modeSwitch">
          <button type="button" id="mode-new" class="seg-btn active">新授权登录</button>
          <button type="button" id="mode-existing" class="seg-btn">已有授权登录</button>
        </div>

        <form id="auth-form" action="/login/auth/authSubmit" method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="uid">玩家 UID</label>
            <input type="text" id="uid" name="uid" class="form-control" placeholder="请输入玩家 UID" inputmode="numeric" pattern="^[0-9]{1,20}$" required>
          </div>

          <div id="cdk-row" class="mb-3">
            <label class="form-label" for="cdk">授权 CDK</label>
            <input type="text" id="cdk" name="cdk" class="form-control" placeholder="请输入授权 CDK" pattern="^(?:[A-Za-z0-9]{16}|[A-Za-z0-9]{20}|(?:[A-Za-z0-9]{4}-){3}[A-Za-z0-9]{4}|(?:[A-Za-z0-9]{5}-){3}[A-Za-z0-9]{5})$" required>
            <p class="field-help">支持 16 位/20 位，允许短横线分组格式。</p>
          </div>

          <div class="mb-3 server-row">
            <div>
              <label class="form-label" for="serverid">目标大区</label>
              <select id="serverid" name="serverid" class="form-select" required>
                <option value="">请选择大区</option>
              </select>
            </div>
            <button type="button" id="reload-server" class="btn btn-light reload-btn">
              <i class="mdi mdi-refresh"></i>刷新
            </button>
          </div>

          <div class="mb-3">
            <label class="form-label" for="authpass">授权密码</label>
            <input type="password" id="authpass" name="authpass" class="form-control" placeholder="请输入授权密码" required>
          </div>

          <button id="submit-btn" type="submit" class="btn btn-primary submit-btn">
            <i class="mdi mdi-login"></i>授权登录
          </button>

          <p id="mode-tip" class="mode-tip">新授权：使用 UID + CDK + 授权密码完成首次绑定。</p>
        </form>

        <div class="foot-link">登录成功后将自动跳转到控制台：<code>/login/auth/dashboard</code></div>
      </div>
    </section>
  </div>

  <script>
    (function() {
      var ROUTE = {
        authSubmit: "/login/auth/authSubmit",
        authExisting: "/login/auth/authExisting",
        dashboard: "/login/auth/dashboard",
        serverUrls: [
          "/login/auth/getServers",
          "/index.php?s=/login/index/getServers",
          "/index.php?s=/player/getServers"
        ]
      };

      var form = document.getElementById("auth-form");
      var submitBtn = document.getElementById("submit-btn");
      var modeNewBtn = document.getElementById("mode-new");
      var modeExistingBtn = document.getElementById("mode-existing");
      var modeTip = document.getElementById("mode-tip");
      var msgBox = document.getElementById("msgBox");

      var cdkRow = document.getElementById("cdk-row");
      var cdkInput = document.getElementById("cdk");
      var uidInput = document.getElementById("uid");
      var serverSelect = document.getElementById("serverid");
      var authpassInput = document.getElementById("authpass");

      var mode = "new";

      function showToast(type, text) {
        if (window.Swal) {
          Swal.mixin({ toast: true, position: "top", showConfirmButton: false, timer: 1600, timerProgressBar: true })
            .fire({ icon: type, title: text || "" });
          return;
        }
        alert(text || "提示");
      }

      function showBanner(type, text) {
        msgBox.className = "alert " + (type === "success" ? "alert-success" : "alert-danger");
        msgBox.textContent = text;
        msgBox.style.display = "block";
      }

      function hideBanner() {
        msgBox.style.display = "none";
      }

      function setMode(nextMode) {
        mode = nextMode === "existing" ? "existing" : "new";

        modeNewBtn.classList.toggle("active", mode === "new");
        modeExistingBtn.classList.toggle("active", mode === "existing");

        if (mode === "existing") {
          cdkRow.classList.add("hide");
          cdkInput.required = false;
          serverSelect.required = false;
          submitBtn.classList.remove("btn-primary");
          submitBtn.classList.add("btn-success");
          submitBtn.innerHTML = '<i class="mdi mdi-login"></i>已有授权登录';
          modeTip.textContent = "已有授权：使用 UID + 授权密码快速登录，无需再次输入 CDK。";
        } else {
          cdkRow.classList.remove("hide");
          cdkInput.required = true;
          serverSelect.required = true;
          submitBtn.classList.remove("btn-success");
          submitBtn.classList.add("btn-primary");
          submitBtn.innerHTML = '<i class="mdi mdi-login"></i>授权登录';
          modeTip.textContent = "新授权：使用 UID + CDK + 授权密码完成首次绑定。";
        }
      }

      modeNewBtn.addEventListener("click", function() { setMode("new"); });
      modeExistingBtn.addEventListener("click", function() { setMode("existing"); });

      cdkInput.addEventListener("input", function() {
        this.value = (this.value || "").toUpperCase().trim();
      });

      function fillServerOptions(data) {
        serverSelect.innerHTML = '<option value="">请选择大区</option>';
        data.forEach(function(s) {
          var opt = document.createElement("option");
          opt.value = s.serverid;
          var label = (s.groupname ? (s.groupname + " - ") : "") + s.name + " (" + s.serverid + ")";
          opt.textContent = label;
          serverSelect.appendChild(opt);
        });
      }

      function loadServers() {
        var lastMsg = "获取大区失败，请检查大区配置";

        function tryFetch(i) {
          if (i >= ROUTE.serverUrls.length) {
            showToast("error", lastMsg);
            return;
          }

          fetch(ROUTE.serverUrls[i], { method: "GET" })
            .then(function(res) { return res.text(); })
            .then(function(text) {
              var json;
              try {
                json = JSON.parse(text);
              } catch (e) {
                throw new Error("NON_JSON");
              }

              if (json && json.code === 1 && Array.isArray(json.data)) {
                fillServerOptions(json.data);
                showToast("success", "大区列表已更新");
                return;
              }

              lastMsg = (json && json.msg) ? json.msg : lastMsg;
              throw new Error("BAD_RESP");
            })
            .catch(function() {
              tryFetch(i + 1);
            });
        }

        tryFetch(0);
      }

      document.getElementById("reload-server").addEventListener("click", loadServers);
      loadServers();

      form.addEventListener("submit", function(event) {
        event.preventDefault();
        hideBanner();

        var uid = (uidInput.value || "").trim();
        var authpass = (authpassInput.value || "").trim();
        var serverid = (serverSelect.value || "").trim();
        var cdk = (cdkInput.value || "").trim();

        if (!/^[0-9]{1,20}$/.test(uid)) {
          showBanner("error", "请输入正确的 UID（仅数字）");
          return;
        }
        if (!authpass) {
          showBanner("error", "请输入授权密码");
          return;
        }

        if (mode === "new") {
          if (!serverid) {
            showBanner("error", "请选择目标大区");
            return;
          }
          var cdkReg = /^(?:[A-Za-z0-9]{16}|[A-Za-z0-9]{20}|(?:[A-Za-z0-9]{4}-){3}[A-Za-z0-9]{4}|(?:[A-Za-z0-9]{5}-){3}[A-Za-z0-9]{5})$/;
          if (!cdkReg.test(cdk)) {
            showBanner("error", "CDK 格式不正确");
            return;
          }
        }

        var oldHtml = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm mr-1"></span>提交中...';

        var body = new URLSearchParams();
        body.set("uid", uid);
        body.set("authpass", authpass);
        if (serverid) body.set("serverid", serverid);
        if (mode === "new") body.set("cdk", cdk);

        var targetUrl = mode === "new" ? ROUTE.authSubmit : ROUTE.authExisting;

        fetch(targetUrl, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
          body: body.toString()
        })
        .then(function(res) { return res.text(); })
        .then(function(text) {
          var json;
          try {
            json = JSON.parse(text);
          } catch (e) {
            throw new Error("NON_JSON");
          }

          if (json && json.code === 1) {
            showToast("success", json.msg || "登录成功");
            setTimeout(function() {
              location.href = ROUTE.dashboard;
            }, 700);
            return;
          }

          showBanner("error", (json && json.msg) ? json.msg : "登录失败");
        })
        .catch(function() {
          showBanner("error", "服务异常，请稍后重试");
        })
        .finally(function() {
          submitBtn.disabled = false;
          submitBtn.innerHTML = oldHtml;
        });
      });
    })();
  </script>

  <script type="text/javascript" src="__MB__/js/jquery.min.js"></script>
  <script type="text/javascript" src="__MB__/js/popper.min.js"></script>
  <script type="text/javascript" src="__MB__/js/bootstrap.min.js"></script>
</body>
</html>
