<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
<title>梦幻授权控制台</title>
<link rel="shortcut icon" type="image/x-icon" href="__MB__/favicon.ico">
<link rel="stylesheet" type="text/css" href="__MB__/css/materialdesignicons.min.css">
<link rel="stylesheet" type="text/css" href="__MB__/css/bootstrap.min.css">
<link rel="stylesheet" type="text/css" href="__MB__/css/style.min.css">
<style>
  :root {
    --tk-bg: #f3f6fb;
    --tk-card: #ffffff;
    --tk-border: #e6ebf2;
    --tk-text: #1f2937;
    --tk-subtext: #667085;
    --tk-primary: #1677ff;
    --tk-primary-soft: #eaf3ff;
    --tk-success: #16a34a;
    --tk-danger: #e11d48;
    --tk-warning: #f59e0b;
    --tk-radius-card: 14px;
    --tk-radius-control: 10px;
    --tk-space-1: 6px;
    --tk-space-2: 8px;
    --tk-space-3: 10px;
    --tk-space-4: 12px;
    --tk-space-5: 16px;
    --tk-space-6: 20px;
    --tk-space-8: 28px;
    --tk-btn-h: 44px;
    --tk-font-xs: 12px;
    --tk-font-sm: 13px;
    --tk-font-md: 15px;
    --tk-font-lg: 18px;
    --tk-font-xl: 22px;
    --tk-line-tight: 1.25;
    --tk-line-normal: 1.5;
    --tk-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
  }

  html, body {
    margin: 0;
    background: var(--tk-bg);
    color: var(--tk-text);
  }

  .dashboard-wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: var(--tk-space-4);
    padding-bottom: 84px;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(243, 246, 251, 0.92);
    backdrop-filter: blur(8px);
    border: 1px solid var(--tk-border);
    border-radius: var(--tk-radius-card);
    padding: var(--tk-space-4);
    margin-bottom: var(--tk-space-4);
    box-shadow: var(--tk-shadow);
  }

  .app-title {
    margin: 0;
    font-size: var(--tk-font-lg);
    font-weight: 700;
    line-height: var(--tk-line-tight);
  }

  .app-subtitle {
    margin: var(--tk-space-1) 0 0;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  .logout-btn {
    white-space: nowrap;
    border-radius: var(--tk-radius-control);
    min-height: 36px;
  }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--tk-space-3);
    margin-bottom: var(--tk-space-4);
  }

  .status-card,
  .panel {
    background: var(--tk-card);
    border: 1px solid var(--tk-border);
    border-radius: var(--tk-radius-card);
    box-shadow: var(--tk-shadow);
  }

  .status-card {
    padding: var(--tk-space-4);
  }

  .status-label {
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    margin-bottom: var(--tk-space-1);
  }

  .status-value {
    font-size: var(--tk-font-md);
    font-weight: 700;
    line-height: 1.35;
    word-break: break-all;
  }

  .panel {
    overflow: hidden;
    margin-bottom: var(--tk-space-4);
  }

  .panel-head {
    border-bottom: 1px solid var(--tk-border);
    padding: var(--tk-space-4) var(--tk-space-5);
    background: #fbfcff;
    font-size: var(--tk-font-sm);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: var(--tk-space-1);
  }

  .panel-body {
    padding: var(--tk-space-5);
  }

  #msgBox {
    display: none;
    border-radius: var(--tk-radius-control);
    margin-bottom: var(--tk-space-4);
  }

  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--tk-space-2);
    margin-bottom: var(--tk-space-4);
  }

  .seg-btn {
    border: 1px solid var(--tk-border);
    background: #fff;
    color: var(--tk-text);
    border-radius: var(--tk-radius-control);
    min-height: calc(var(--tk-btn-h) - 2px);
    font-size: var(--tk-font-sm);
    font-weight: 600;
    transition: all 0.2s ease;
  }

  .seg-btn.active {
    border-color: var(--tk-primary);
    background: var(--tk-primary-soft);
    color: var(--tk-primary);
  }

  .pane {
    display: none;
  }

  .pane.active {
    display: block;
  }

  .form-label {
    font-size: var(--tk-font-sm);
    font-weight: 600;
    margin-bottom: var(--tk-space-1);
  }

  .form-control {
    min-height: var(--tk-btn-h);
    border-radius: var(--tk-radius-control);
    font-size: 16px;
  }

  .quick-row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--tk-space-1);
    margin-top: var(--tk-space-2);
  }

  .quick-btn {
    border: 1px solid var(--tk-border);
    background: #fff;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: var(--tk-font-xs);
    line-height: 1;
    color: #344054;
  }

  .quick-btn.active,
  .quick-btn:active {
    border-color: var(--tk-primary);
    background: var(--tk-primary-soft);
    color: var(--tk-primary);
  }

  .submit-btn {
    min-height: var(--tk-btn-h);
    border-radius: var(--tk-radius-control);
    font-size: var(--tk-font-md);
    font-weight: 600;
  }

  .tip-text {
    margin-top: var(--tk-space-2);
    margin-bottom: 0;
    font-size: var(--tk-font-xs);
    color: var(--tk-subtext);
    line-height: var(--tk-line-normal);
  }

  .note-list {
    margin: 0;
    padding-left: 18px;
    font-size: var(--tk-font-sm);
    color: #475467;
  }

  .note-list li {
    margin-bottom: var(--tk-space-1);
    line-height: var(--tk-line-normal);
  }

  .fixed-action {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 30;
    background: rgba(255, 255, 255, 0.94);
    border-top: 1px solid var(--tk-border);
    backdrop-filter: blur(8px);
    padding: var(--tk-space-2) var(--tk-space-4);
  }

  .fixed-inner {
    max-width: 980px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--tk-space-2);
  }

  .fixed-btn {
    min-height: 40px;
    border-radius: var(--tk-radius-control);
    font-size: var(--tk-font-sm);
    font-weight: 600;
  }

  @media (min-width: 768px) {
    .dashboard-wrap {
      padding: var(--tk-space-5);
      padding-bottom: var(--tk-space-5);
    }

    .status-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .fixed-action {
      display: none;
    }
  }

  @media (max-width: 380px) {
    .dashboard-wrap {
      padding: var(--tk-space-3);
    }

    .panel-body {
      padding: var(--tk-space-4);
    }
  }
</style>
</head>
<body>
  <div class="dashboard-wrap">
    <header class="app-header d-flex align-items-center justify-content-between">
      <div>
        <h1 class="app-title">梦幻授权控制台</h1>
        <p class="app-subtitle">统一设计 token，支持手机端优先操作。</p>
      </div>
      <a href="/login/auth/logout" class="btn btn-outline-danger btn-sm logout-btn">
        <i class="mdi mdi-logout"></i>退出
      </a>
    </header>

    <section class="status-grid">
      <article class="status-card">
        <div class="status-label">当前 UID</div>
        <div class="status-value">{$uid}</div>
      </article>
      <article class="status-card">
        <div class="status-label">当前大区</div>
        <div class="status-value">{$servername}</div>
      </article>
      <article class="status-card">
        <div class="status-label">ServerID / 分组</div>
        <div class="status-value">{$serverid} {$groupname}</div>
      </article>
    </section>

    <div id="msgBox" class="alert" role="alert"></div>

    <section class="panel">
      <div class="panel-head">
        <i class="mdi mdi-lightning-bolt-outline"></i>
        快捷操作
      </div>
      <div class="panel-body">
        <div class="segmented" id="opTabs">
          <button type="button" class="seg-btn active" data-pane="paneItem">物品发放</button>
          <button type="button" class="seg-btn" data-pane="paneXy">仙玉充值</button>
        </div>

        <div class="pane active" id="paneItem">
          <form id="formSendItem" novalidate>
            <div class="mb-3">
              <label class="form-label" for="itemToken">物品名称</label>
              <select id="itemToken" name="item_token" class="form-control" required>
                <option value="">请选择物品</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="itemNum">发放数量</label>
              <input id="itemNum" name="number" type="number" min="1" max="9999" inputmode="numeric" pattern="[0-9]*" class="form-control" placeholder="1 - 9999" required>
              <div class="quick-row" data-target="itemNum">
                <button type="button" class="quick-btn" data-val="1">1</button>
                <button type="button" class="quick-btn" data-val="10">10</button>
                <button type="button" class="quick-btn" data-val="99">99</button>
                <button type="button" class="quick-btn" data-val="999">999</button>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 submit-btn" id="btnSendItem">
              <i class="mdi mdi-send"></i>发送物品
            </button>
            <p class="tip-text">优先直发背包，失败将按后端策略回退为系统邮件补发。</p>
          </form>
        </div>

        <div class="pane" id="paneXy">
          <form id="formRechargeXy" novalidate>
            <div class="mb-3">
              <label class="form-label" for="xyNum">仙玉数量</label>
              <input id="xyNum" name="number" type="number" min="1" max="99999999" inputmode="numeric" pattern="[0-9]*" class="form-control" placeholder="1 - 99999999" required>
              <div class="quick-row" data-target="xyNum">
                <button type="button" class="quick-btn" data-val="100">100</button>
                <button type="button" class="quick-btn" data-val="1000">1000</button>
                <button type="button" class="quick-btn" data-val="10000">10000</button>
                <button type="button" class="quick-btn" data-val="50000">50000</button>
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100 submit-btn" id="btnRechargeXy">
              <i class="mdi mdi-cash-plus"></i>充值仙玉
            </button>
            <p class="tip-text">仙玉范围 1 - 99999999，请确认角色后再提交。</p>
          </form>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <i class="mdi mdi-information-outline"></i>
        操作说明
      </div>
      <div class="panel-body">
        <ul class="note-list">
          <li>所有敏感操作都通过签名校验，防止重放请求。</li>
          <li>物品数量范围 1 - 9999，仙玉数量范围 1 - 99999999。</li>
          <li>请选择物品名称进行发放，前端不再展示或提交物品ID。</li>
        </ul>
      </div>
    </section>
  </div>

  <div class="fixed-action">
    <div class="fixed-inner">
      <button type="button" class="btn btn-outline-primary fixed-btn" data-pane-switch="paneItem">物品发放</button>
      <button type="button" class="btn btn-outline-success fixed-btn" data-pane-switch="paneXy">仙玉充值</button>
    </div>
  </div>

  <script>
    (function() {
      var ROUTE = {
        prepareOp: "/login/auth/prepareOp",
        sendItem: "/login/auth/sendItem",
        rechargeXianyu: "/login/auth/rechargeXianyu",
        getItemList: "/login/auth/getItemList"
      };

      function showMessage(type, message) {
        var box = document.getElementById("msgBox");
        box.className = "alert " + (type === "success" ? "alert-success" : "alert-danger");
        box.textContent = message || (type === "success" ? "操作成功" : "操作失败");
        box.style.display = "block";
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function clearOldSig(formEl) {
        var oldTs = formEl.querySelector('input[name="op_ts"]');
        var oldSig = formEl.querySelector('input[name="op_sig"]');
        if (oldTs) oldTs.remove();
        if (oldSig) oldSig.remove();
      }

      async function getOpSig(action, params) {
        var fd = new FormData();
        fd.append("action", action);
        Object.keys(params || {}).forEach(function(k) {
          fd.append(k, String(params[k]));
        });

        var response = await fetch(ROUTE.prepareOp, { method: "POST", body: fd });
        var text = await response.text();
        var json;
        try {
          json = JSON.parse(text);
        } catch (e) {
          throw new Error((text || "").trim() || "签名服务异常");
        }
        if (json.code !== 1 || !json.data || !json.data.ts || !json.data.sig) {
          throw new Error((json && json.msg) ? String(json.msg) : "签名服务异常");
        }
        return { op_ts: json.data.ts, op_sig: json.data.sig };
      }

      function parseResult(response) {
        var ct = (response.headers.get("content-type") || "").toLowerCase();
        if (ct.indexOf("application/json") >= 0) {
          return response.json().catch(function() { return { code: 0, msg: "JSON 解析失败" }; });
        }
        return response.text().then(function(text) {
          try {
            return JSON.parse(text);
          } catch (e) {
            return { code: 0, msg: text || "服务返回异常" };
          }
        });
      }

      function escapeHtml(text) {
        return String(text || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function setBtnLoading(btn, isLoading, loadingText) {
        if (!btn) return;
        if (!btn.dataset.originHtml) {
          btn.dataset.originHtml = btn.innerHTML;
        }
        btn.disabled = !!isLoading;
        btn.innerHTML = isLoading
          ? '<i class="mdi mdi-loading mdi-spin"></i>' + (loadingText || "处理中...")
          : btn.dataset.originHtml;
      }

      function submitForm(url, formEl, submitBtn, successText, clearFn) {
        setBtnLoading(submitBtn, true, "提交中...");
        var body = new URLSearchParams(new FormData(formEl));

        return fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: body.toString()
        })
        .then(parseResult)
        .then(function(data) {
          if (data.code === 1) {
            if (typeof clearFn === "function") clearFn();
            showMessage("success", data.msg || successText || "操作成功");
            return;
          }
          showMessage("error", data.msg || "操作失败");
        })
        .catch(function() {
          showMessage("error", "网络异常，请稍后重试");
        })
        .finally(function() {
          setBtnLoading(submitBtn, false);
        });
      }

      function switchPane(targetId) {
        document.querySelectorAll(".pane").forEach(function(pane) {
          pane.classList.remove("active");
        });
        document.querySelectorAll(".seg-btn").forEach(function(btn) {
          btn.classList.remove("active");
        });

        var pane = document.getElementById(targetId);
        if (pane) pane.classList.add("active");

        var tabBtn = document.querySelector('.seg-btn[data-pane="' + targetId + '"]');
        if (tabBtn) tabBtn.classList.add("active");
      }

      document.getElementById("opTabs").addEventListener("click", function(e) {
        var btn = e.target.closest(".seg-btn");
        if (!btn) return;
        switchPane(btn.getAttribute("data-pane"));
      });

      document.querySelectorAll("[data-pane-switch]").forEach(function(btn) {
        btn.addEventListener("click", function() {
          switchPane(btn.getAttribute("data-pane-switch"));
        });
      });

      document.querySelectorAll(".quick-row").forEach(function(row) {
        row.addEventListener("click", function(e) {
          var btn = e.target.closest(".quick-btn");
          if (!btn) return;

          var targetId = row.getAttribute("data-target");
          var input = document.getElementById(targetId);
          if (!input) return;

          input.value = btn.getAttribute("data-val") || "";
          input.focus();

          row.querySelectorAll(".quick-btn").forEach(function(x) { x.classList.remove("active"); });
          btn.classList.add("active");
        });
      });

      document.getElementById("formSendItem").addEventListener("submit", async function(e) {
        e.preventDefault();

        var formEl = this;
        var submitBtn = document.getElementById("btnSendItem");
        var token = (document.getElementById("itemToken").value || "").trim();
        var number = parseInt(document.getElementById("itemNum").value, 10);

        if (!number || number < 1 || number > 9999) {
          showMessage("error", "物品数量不合法（1-9999）");
          return;
        }

        if (!token) {
          showMessage("error", "请选择物品名称");
          return;
        }

        clearOldSig(formEl);

        try {
          var sig = await getOpSig("sendItem", { item_token: token, number: number });
          var tsEl = document.createElement("input");
          var sigEl = document.createElement("input");
          tsEl.type = "hidden";
          sigEl.type = "hidden";
          tsEl.name = "op_ts";
          sigEl.name = "op_sig";
          tsEl.value = String(sig.op_ts);
          sigEl.value = String(sig.op_sig);
          formEl.appendChild(tsEl);
          formEl.appendChild(sigEl);
        } catch (err) {
          showMessage("error", (err && err.message) ? err.message : "签名服务异常");
          return;
        }

        submitForm(ROUTE.sendItem, formEl, submitBtn, "物品发送成功", function() {
          document.getElementById("itemNum").value = "";
        });
      });

      document.getElementById("formRechargeXy").addEventListener("submit", async function(e) {
        e.preventDefault();

        var formEl = this;
        var submitBtn = document.getElementById("btnRechargeXy");
        var number = parseInt(document.getElementById("xyNum").value, 10);

        if (!number || number < 1 || number > 99999999) {
          showMessage("error", "仙玉数量不合法（1-99999999）");
          return;
        }

        clearOldSig(formEl);
        try {
          var sig = await getOpSig("rechargeXianyu", { number: number });
          var tsEl = document.createElement("input");
          var sigEl = document.createElement("input");
          tsEl.type = "hidden";
          sigEl.type = "hidden";
          tsEl.name = "op_ts";
          sigEl.name = "op_sig";
          tsEl.value = String(sig.op_ts);
          sigEl.value = String(sig.op_sig);
          formEl.appendChild(tsEl);
          formEl.appendChild(sigEl);
        } catch (err) {
          showMessage("error", (err && err.message) ? err.message : "签名服务异常");
          return;
        }

        submitForm(ROUTE.rechargeXianyu, formEl, submitBtn, "仙玉充值成功", function() {
          document.getElementById("xyNum").value = "";
        });
      });

      document.addEventListener("DOMContentLoaded", async function() {
        try {
          var itemResp = await fetch(ROUTE.getItemList);
          var itemJson = await itemResp.json().catch(function() { return { code: 0 }; });
          if (itemJson.code === 1 && Array.isArray(itemJson.data)) {
            window.__ITEMS = itemJson.data.filter(function(x) {
              return x && x.name && x.token;
            });
            var select = document.getElementById("itemToken");
            select.innerHTML = '<option value="">请选择物品</option>';
            window.__ITEMS.forEach(function(x) {
              var opt = document.createElement("option");
              opt.value = x.token;
              opt.textContent = x.name;
              select.appendChild(opt);
            });
          } else {
            showMessage("error", (itemJson && itemJson.msg) ? itemJson.msg : "物品列表加载失败");
          }
        } catch (err) {
          showMessage("error", "物品列表加载失败，请稍后重试");
        }
      });
    })();
  </script>
</body>
</html>
