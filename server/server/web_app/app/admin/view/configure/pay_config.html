		<script>
			/**
			 * 分页相关的配置
			 **/
			var pagination = {
				// 分页方式：[client] 客户端分页，[server] 服务端分页
				sidePagination: "server",
				// 初始化加载第一页，默认第一页
				pageNumber: 1,
				// 每页的记录行数
				pageSize: 10,
				// 可供选择的每页的行数 - (亲测大于1000存在渲染问题)
				pageList: [5, 10, 25, 50, 100],
				// 在上百页的情况下体验较好 - 能够显示首尾页
				paginationLoop: true,
				// 展示首尾页的最小页数
				paginationPagesBySide: 2
			};

			/**
			 * 按钮相关配置
			 **/
			var button = {
				// 按钮的类
				buttonsClass: 'default',
				// 类名前缀
				buttonsPrefix: 'btn'
			}

			/**
			 * 图标相关配置
			 **/
			var icon = {
				// 图标前缀
				iconsPrefix: 'mdi',
				// 图标大小
				iconSize: 'mini',
				// 图标的设置
				icons: {
					paginationSwitchDown: 'mdi-door-closed',
					paginationSwitchUp: 'mdi-door-open',
					refresh: 'mdi-refresh',
					toggleOff: 'mdi-toggle-switch-off',
					toggleOn: 'mdi-toggle-switch',
					columns: 'mdi-table-column-remove',
					detailOpen: 'mdi-plus',
					detailClose: 'mdi-minus',
					fullscreen: 'mdi-monitor-screenshot',
					search: 'mdi-table-search',
					clearSearch: 'mdi-trash-can-outline'
				}
			};

			/**
			 * 表格相关的配置
			 **/
			var table = {
				classes: 'table table-bordered table-hover table-striped lyear-table',
				// 请求地址
				url: '/index.php?s=/{$app}/configure/payChannel',
				// 唯一ID字段
				uniqueId: 'id',
				// 每行的唯一标识字段
				idField: 'id',
				// 是否启用点击选中行
				clickToSelect: true,
				// 是否显示详细视图和列表视图的切换按钮(clickToSelect同时设置为true时点击会报错)
				// showToggle: true,
				// 请求得到的数据类型
				dataType: 'jsonp',
				// 请求方法
				method: 'post',
				// 工具按钮容器
				toolbar: '#toolbar',
				// 是否分页
				pagination: true,
				// 是否显示所有的列
				showColumns: true,
				// 是否显示刷新按钮
				showRefresh: true,
				// 显示图标
				showButtonIcons: true,
				// 显示文本
				showButtonText: false,
				// 显示全屏
				showFullscreen: true,
				// 开关控制分页
				showPaginationSwitch: true,
				// 总数字段
				totalField: 'total',
				// 当字段为 undefined 显示
				undefinedText: '-',
				// 排序方式
				sortOrder: "asc",
				...icon,
				...pagination,
				...button
			};

			/**
			 * 用于演示的列信息
			 **/
			var columns = [{
				field: 'example',
				checkbox: true,
				// 列的宽度
				width: 3,
				// 宽度单位
				widthUnit: 'rem'
			}, {
				field: 'id',
				title: 'ID',
				// 使用[align]，[halign]和[valign]选项来设置列和它们的标题的对齐方式。
				// h表示横向，v标识垂直
				align: 'center',
				// 是否作为排序列
				sortable: true,
				// 当列名称与实际名称不一致时可用
				sortName: 'id',
				switchable: false,
				// 列的宽度
				width: 3,
				// 宽度单位
				widthUnit: 'rem'
			}, {
				field: 'channel',
				align: 'center',
				title: '通道类型'
			}, {
				field: 'name',
				align: 'center',
				title: '接口备注',
			}, {
				field: 'pay_api',
				align: 'center',
				title: '接口地址'
			}, {
				field: 'pay_pid',
				align: 'center',
				title: 'PID'
			}, {
				field: 'pay_key',
				align: 'center',
				title: 'KEY'
			}, {
				field: 'wxpay',
				title: '微信',
				formatter: function (value, row, index) {
					var value = "";
					if (row.wxpay == '0') {
						value = '<span class="badge bg-danger">关闭</span>';
					} else if (row.wxpay == '1') {
						value = '<span class="badge bg-success">启用</span>';
					} else {
						value = '<span class="badge bg-secondary">未知</span>';
					}
					return value;
				}
			}, {
				field: 'alipay',
				title: '支付宝',
				formatter: function (value, row, index) {
					var value = "";
					if (row.alipay == '0') {
						value = '<span class="badge bg-danger">关闭</span>';
					} else if (row.alipay == '1') {
						value = '<span class="badge bg-success">启用</span>';
					} else {
						value = '<span class="badge bg-secondary">未知</span>';
					}
					return value;
				}
			}, {
				field: 'status',
				title: '开启状态',
				formatter: function (value, row, index) {
					var value = "";
					if (row.status == '0') {
						value = '<span class="badge bg-danger">关闭</span>';
					} else if (row.status == '1') {
						value = '<span class="badge bg-success">启用</span>';
					} else {
						value = '<span class="badge bg-secondary">未知</span>';
					}
					return value;
				}
			}, {
				field: 'operate',
				title: '操作',
				formatter: btnGroup,  // 自定义方法
				events: {
					'click .edit-btn': function (event, value, row, index) {
						event.stopPropagation();
						editUser(row);
					},
					'click .del-btn': function (event, value, row, index) {
						event.stopPropagation();
						delUser(row);
					}
				}
			}];

			// 自定义操作按钮
			function btnGroup() {
				var html =
					'<a href="#!" class="btn btn-sm btn-default me-1 edit-btn" title="编辑" data-bs-toggle="tooltip"><i class="mdi mdi-pencil"></i></a>' +
					'<a href="#!" class="btn btn-sm btn-default del-btn" title="删除" data-bs-toggle="tooltip"><i class="mdi mdi-window-close"></i></a>';
				return html;
			}

			// 操作方法 - 编辑
			function editUser(row) {
				var id = row.id;
				// 直接跳转到编辑页面
				location.href = '/index.php?s=/{$app}/configure/editPayChannel&id=' + id;
			}

			//操作方法 - 删除
			function delUser(row) {
				var id = row.id;
				// 直接提交到后端
				$.post("/index.php?s=/{$app}/configure/delPayChannel", { id: id, csrf_token: "{$csrf_token}" }, function (res) {
					if (res.code == 1) {
						var Toast = Swal.mixin({
							toast: true,
							position: "top",
							showConfirmButton: false,
							timer: 1500,
							timerProgressBar: true,
							didOpen: (toast) => {
								toast.onmouseenter = Swal.stopTimer;
								toast.onmouseleave = Swal.resumeTimer;
							}
						});
						Toast.fire({
							icon: "success",
							title: res.msg
						});
						setTimeout("self.location.reload();", 1500);
					} else {
						var Toast = Swal.mixin({
							toast: true,
							position: "top",
							showConfirmButton: false,
							timer: 1500,
							timerProgressBar: true,
							didOpen: (toast) => {
								toast.onmouseenter = Swal.stopTimer;
								toast.onmouseleave = Swal.resumeTimer;
							}
						});
						Toast.fire({
							icon: "error",
							title: res.msg
						});
					}
				}).fail(function () {
					var Toast = Swal.mixin({
						toast: true,
						position: "top",
						showConfirmButton: false,
						timer: 1500,
						timerProgressBar: true,
						didOpen: (toast) => {
							toast.onmouseenter = Swal.stopTimer;
							toast.onmouseleave = Swal.resumeTimer;
						}
					});
					Toast.fire({
						icon: "question",
						title: '服务异常'
					});
				});
			}

			$('table').bootstrapTable({
				...table,
				// 自定义的查询参数
				queryParams: function (params) {
					return {
						// 每页数据量
						limit: params.limit,
						// sql语句起始索引
						offset: params.offset,
						page: (params.offset / params.limit) + 1,
						// 排序的列名
						sort: params.sort,
						// 排序方式 'asc' 'desc'
						sortOrder: params.order
					};
				},
				columns,
				onLoadSuccess: function (data) {
					$("[data-bs-toggle='tooltip']").tooltip();
				}
			});
		</script>
