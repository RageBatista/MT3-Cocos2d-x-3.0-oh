<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
  <link rel="stylesheet" type="text/css" href="__MB__/css/materialdesignicons.min.css">
  <link rel="stylesheet" type="text/css" href="__MB__/css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="__MB__/css/style.min.css">
  <link rel="stylesheet" type="text/css" href="__MB__/alert/sweetalert2.min.css">
  <style>
    .stats-bar .badge {
      font-size: 0.85rem;
      padding: 6px 12px;
    }

    .tab-content .table th,
    .tab-content .table td {
      vertical-align: middle;
      white-space: nowrap;
    }

    .tab-content .table .btn {
      white-space: nowrap;
    }

    .pager-bar {
      margin-top: 12px;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-12">
        <div class="card">
          <header class="card-header">
            <div class="card-title">CDK管理</div>
          </header>
          <div class="card-body">

            <!-- Tabs -->
            <ul class="nav nav-tabs" id="cdkTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button class="nav-link active" id="query-tab" data-bs-toggle="tab" data-bs-target="#query"
                  type="button" role="tab">查询</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="generate-tab" data-bs-toggle="tab" data-bs-target="#generate" type="button"
                  role="tab">生成</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="unused-tab" data-bs-toggle="tab" data-bs-target="#unused" type="button"
                  role="tab">未使用</button>
              </li>
              <li class="nav-item" role="presentation">
                <button class="nav-link" id="used-tab" data-bs-toggle="tab" data-bs-target="#used" type="button"
                  role="tab">已使用</button>
              </li>
            </ul>

            <!-- 统计栏 -->
            <div id="cdkStatsBar" class="stats-bar mt-2 mb-2">
              <span class="badge bg-secondary me-2">总CDK数量: <span id="statTotal">0</span></span>
              <span class="badge bg-info text-dark me-2">已使用数量: <span id="statUsed">0</span></span>
              <span class="badge bg-success me-2">未使用数量: <span id="statUnused">0</span></span>
            </div>

            <div class="tab-content pt-3">

              <!-- ========== 查询 Tab ========== -->
              <div class="tab-pane fade show active" id="query" role="tabpanel">
                <form id="cdkQueryForm" method="post" class="edit-form">
                  <input type="hidden" name="csrf_token" value="{$csrf_token}" />
                  <div class="row g-3">
                    <div class="col-md-3">
                      <label class="form-label">CDK码</label>
                      <input type="text" class="form-control" name="cdk" placeholder="例如：XXXX-XXXX-XXXX-XXXX">
                    </div>
                    <div class="col-md-2">
                      <label class="form-label">角色ID(uid)</label>
                      <input type="text" class="form-control" name="uid" placeholder="可选">
                    </div>
                    <div class="col-md-2">
                      <label class="form-label">区服ID(qid)</label>
                      <input type="text" class="form-control" name="qid" placeholder="可选">
                    </div>
                    <div class="col-md-2">
                      <label class="form-label">状态</label>
                      <select class="form-select" name="status">
                        <option value="">全部</option>
                        <option value="0">未使用</option>
                        <option value="1">已使用</option>
                      </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end gap-2">
                      <button type="submit" class="btn btn-primary">查询</button>
                      <button type="button" class="btn btn-secondary" id="queryReset">重置</button>
                      <button type="button" class="btn btn-success" id="downloadQuery">下载结果</button>
                    </div>
                  </div>
                </form>
                <hr>
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>CDK</th>
                        <th>等级</th>
                        <th>区服</th>
                        <th>角色</th>
                        <th>使用时间</th>
                        <th>授权密码</th>
                        <th>状态</th>
                      </tr>
                    </thead>
                    <tbody id="queryTableBody"></tbody>
                  </table>
                </div>
                <div id="queryPager" class="pager-bar d-flex align-items-center justify-content-between">
                  <div>
                    <button class="btn btn-sm btn-outline-secondary" id="queryPrev">上一页</button>
                    <button class="btn btn-sm btn-outline-secondary ms-2" id="queryNext">下一页</button>
                  </div>
                  <div class="text-muted"><span id="queryPageText">第 0 / 0 页</span> | 共 <span
                      id="queryTotalText">0</span> 条</div>
                </div>
              </div>

              <!-- ========== 生成 Tab ========== -->
              <div class="tab-pane fade" id="generate" role="tabpanel">
                <form id="cdkGenerateForm" method="post" class="edit-form">
                  <input type="hidden" name="csrf_token" value="{$csrf_token}" />
                  <div class="row g-3">
                    <div class="col-md-4">
                      <label class="form-label">生成数量</label>
                      <input type="number" min="1" max="100000" class="form-control" name="count" value="10">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">等级(lv)</label>
                      <input type="number" min="0" max="99" class="form-control" name="lv" value="0">
                    </div>
                    <div class="col-md-4">
                      <label class="form-label">位数</label>
                      <select class="form-select" name="length">
                        <option value="16">16位（带横杠）</option>
                        <option value="20">20位（带横杠）</option>
                      </select>
                    </div>
                  </div>
                  <div class="mt-3">
                    <button type="submit" class="btn btn-primary">立即生成</button>
                  </div>
                </form>
                <hr>
                <div id="generateResult" class="alert alert-info" style="display:none;"></div>
              </div>

              <!-- ========== 未使用 Tab ========== -->
              <div class="tab-pane fade" id="unused" role="tabpanel">
                <div class="mb-2">
                  <button class="btn btn-outline-primary" id="refreshUnused">刷新</button>
                  <button class="btn btn-outline-success ms-2" id="downloadUnused">下载未使用</button>
                </div>
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>CDK</th>
                        <th>等级(lv)</th>
                      </tr>
                    </thead>
                    <tbody id="unusedTableBody"></tbody>
                  </table>
                </div>
                <div id="unusedPager" class="pager-bar d-flex align-items-center justify-content-between">
                  <div>
                    <button class="btn btn-sm btn-outline-secondary" id="unusedPrev">上一页</button>
                    <button class="btn btn-sm btn-outline-secondary ms-2" id="unusedNext">下一页</button>
                  </div>
                  <div class="text-muted"><span id="unusedPageText">第 0 / 0 页</span> | 共 <span
                      id="unusedTotalText">0</span> 条</div>
                </div>
              </div>

              <!-- ========== 已使用 Tab ========== -->
              <div class="tab-pane fade" id="used" role="tabpanel">
                <div class="mb-2">
                  <button class="btn btn-outline-primary" id="refreshUsed">刷新</button>
                </div>
                <div class="table-responsive">
                  <table class="table table-striped table-hover">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>CDK</th>
                        <th>等级</th>
                        <th>区服</th>
                        <th>角色</th>
                        <th>授权密码</th>
                        <th>使用时间</th>
                        <th>操作</th>
                      </tr>
                    </thead>
                    <tbody id="usedTableBody"></tbody>
                  </table>
                </div>
                <div id="usedPager" class="pager-bar d-flex align-items-center justify-content-between">
                  <div>
                    <button class="btn btn-sm btn-outline-secondary" id="usedPrev">上一页</button>
                    <button class="btn btn-sm btn-outline-secondary ms-2" id="usedNext">下一页</button>
                  </div>
                  <div class="text-muted"><span id="usedPageText">第 0 / 0 页</span> | 共 <span id="usedTotalText">0</span>
                    条</div>
                </div>
              </div>

            </div><!-- /tab-content -->
          </div><!-- /card-body -->
        </div>
      </div>
    </div>
  </div>

  <script type="text/javascript" src="__MB__/js/jquery.min.js"></script>
  <script type="text/javascript" src="__MB__/js/popper.min.js"></script>
  <script type="text/javascript" src="__MB__/js/bootstrap.min.js"></script>
  <script src="__MB__/alert/sweetalert2.all.min.js"></script>

  <script>
    // ===== XSS 防护 =====
    function htmlEncode(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/[&<>"'\/]/g, function (s) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '/': '&#x2F;' }[s];
      });
    }

    // ===== 公共 Toast（唯一定义） =====
    function toastOk(msg) { Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500, timerProgressBar: true }).fire({ icon: 'success', title: msg }); }
    function toastErr(msg) { Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500, timerProgressBar: true }).fire({ icon: 'error', title: msg }); }
    function toastWarn(msg) { Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 1500, timerProgressBar: true }).fire({ icon: 'question', title: msg }); }

    // ===== 分页 =====
    var PAGE_SIZE = 10;
    var csrf_token = "{$csrf_token}";
    var queryPage = 1, queryTotalPages = 0, queryTotal = 0, lastQueryData = '';
    var unusedPage = 1, unusedTotalPages = 0, unusedTotal = 0;
    var usedPage = 1, usedTotalPages = 0, usedTotal = 0;

    function updatePager(prefix, page, totalPages, total) {
      $('#' + prefix + 'PageText').text('第 ' + (totalPages ? page : 0) + ' / ' + totalPages + ' 页');
      $('#' + prefix + 'TotalText').text(total || 0);
      $('#' + prefix + 'Prev').prop('disabled', page <= 1 || totalPages <= 1);
      $('#' + prefix + 'Next').prop('disabled', page >= totalPages || totalPages <= 1);
    }

    // ===== 统计 =====
    function loadStats() {
      $.get('/index.php?s=/{$app}/gm/cdkStats', function (res) {
        if (res.code === 1 && res.data) {
          $('#statTotal').text(res.data.total || 0);
          $('#statUsed').text(res.data.used || 0);
          $('#statUnused').text(res.data.unused || 0);
        }
      });
    }

    // ===== 查询 =====
    $('#cdkQueryForm').on('submit', function (e) {
      e.preventDefault();
      lastQueryData = $(this).serialize();
      queryPage = 1;
      loadQuery();
    });

    function loadQuery() {
      var payload = lastQueryData + '&page=' + queryPage + '&pageSize=' + PAGE_SIZE;
      $.post('/index.php?s=/{$app}/gm/cdkQuery', payload, function (res) {
        if (res.code === 1) {
          var rows = (res.data && res.data.list) ? res.data.list : [];
          var html = rows.map(function (r) {
            return '<tr>'
              + '<td>' + htmlEncode(r.id) + '</td>'
              + '<td>' + htmlEncode(r.cdk) + '</td>'
              + '<td>' + htmlEncode(r.lv) + '</td>'
              + '<td>' + htmlEncode(r.qid) + '</td>'
              + '<td>' + htmlEncode(r.uid) + '</td>'
              + '<td>' + htmlEncode(r.used_at) + '</td>'
              + '<td>' + htmlEncode(r.pass) + '</td>'
              + '<td>' + (r.status === 1 ? '<span class="badge bg-info">已使用</span>' : '<span class="badge bg-success">未使用</span>') + '</td>'
              + '</tr>';
          }).join('');
          $('#queryTableBody').html(html);
          queryTotalPages = res.data.totalPages || 0;
          queryTotal = res.data.total || 0;
          queryPage = res.data.page || queryPage;
          updatePager('query', queryPage, queryTotalPages, queryTotal);
          toastOk(res.msg || '查询成功');
        } else {
          toastErr(res.msg || '查询失败');
        }
      }).fail(function () { toastWarn('服务异常'); });
    }

    $('#queryPrev').on('click', function () { if (queryPage > 1) { queryPage--; loadQuery(); } });
    $('#queryNext').on('click', function () { if (queryPage < queryTotalPages) { queryPage++; loadQuery(); } });
    $('#queryReset').on('click', function () {
      $('#cdkQueryForm')[0].reset();
      $('#queryTableBody').empty();
      queryPage = 1; queryTotalPages = 0; queryTotal = 0; lastQueryData = '';
      updatePager('query', 0, 0, 0);
    });

    // ===== 未使用 =====
    function loadUnused() {
      $.get('/index.php?s=/{$app}/gm/cdkListUnused&page=' + unusedPage + '&pageSize=' + PAGE_SIZE, function (res) {
        if (res.code === 1) {
          var rows = (res.data && res.data.list) ? res.data.list : [];
          var html = rows.map(function (r) {
            return '<tr><td>' + htmlEncode(r.id) + '</td><td>' + htmlEncode(r.cdk) + '</td><td>' + htmlEncode(r.lv) + '</td></tr>';
          }).join('');
          $('#unusedTableBody').html(html);
          unusedTotalPages = res.data.totalPages || 0;
          unusedTotal = res.data.total || 0;
          unusedPage = res.data.page || unusedPage;
          updatePager('unused', unusedPage, unusedTotalPages, unusedTotal);
          toastOk('已刷新');
          loadStats();
        } else { toastErr(res.msg || '加载失败'); }
      }).fail(function () { toastWarn('服务异常'); });
    }

    $('#refreshUnused').on('click', function () { unusedPage = 1; loadUnused(); });
    $('#unusedPrev').on('click', function () { if (unusedPage > 1) { unusedPage--; loadUnused(); } });
    $('#unusedNext').on('click', function () { if (unusedPage < unusedTotalPages) { unusedPage++; loadUnused(); } });

    // ===== 已使用 =====
    function loadUsed() {
      $.get('/index.php?s=/{$app}/gm/cdkListUsed&page=' + usedPage + '&pageSize=' + PAGE_SIZE, function (res) {
        if (res.code === 1) {
          var rows = (res.data && res.data.list) ? res.data.list : [];
          var html = rows.map(function (r) {
            return '<tr>'
              + '<td>' + htmlEncode(r.id) + '</td>'
              + '<td>' + htmlEncode(r.cdk) + '</td>'
              + '<td>' + htmlEncode(r.lv) + '</td>'
              + '<td>' + htmlEncode(r.qid) + '</td>'
              + '<td>' + htmlEncode(r.uid) + '</td>'
              + '<td>' + htmlEncode(r.pass) + '</td>'
              + '<td>' + htmlEncode(r.used_at) + '</td>'
              + '<td>'
              + '<button class="btn btn-sm btn-primary me-1" onclick="editUsedUid(' + r.id + ',' + (r.uid || 0) + ')">修改账号</button>'
              + '<button class="btn btn-sm btn-secondary me-1" onclick="editUsedPass(' + r.id + ')">修改密码</button>'
              + '<button class="btn btn-sm btn-danger" onclick="deleteUsedCdk(' + r.id + ')">删除</button>'
              + '</td>'
              + '</tr>';
          }).join('');
          $('#usedTableBody').html(html);
          usedTotalPages = res.data.totalPages || 0;
          usedTotal = res.data.total || 0;
          usedPage = res.data.page || usedPage;
          updatePager('used', usedPage, usedTotalPages, usedTotal);
          toastOk('已刷新');
          loadStats();
        } else { toastErr(res.msg || '加载失败'); }
      }).fail(function () { toastWarn('服务异常'); });
    }

    $('#refreshUsed').on('click', function () { usedPage = 1; loadUsed(); });
    $('#usedPrev').on('click', function () { if (usedPage > 1) { usedPage--; loadUsed(); } });
    $('#usedNext').on('click', function () { if (usedPage < usedTotalPages) { usedPage++; loadUsed(); } });

    // ===== 已使用行内操作 =====
    function editUsedUid(id, currentUid) {
      Swal.fire({
        title: '修改使用账号 UID',
        input: 'text',
        inputValue: currentUid || 0,
        showCancelButton: true,
        confirmButtonText: '保存',
        cancelButtonText: '取消',
        allowOutsideClick: false,
        preConfirm: function (value) {
          var uid = parseInt(value, 10);
          if (isNaN(uid) || uid < 0) { Swal.showValidationMessage('请输入合法的非负整数 UID'); return false; }
          return uid;
        }
      }).then(function (result) {
        if (!result.isConfirmed) return;
        $.post('/index.php?s=/{$app}/gm/cdkUpdateUid', { id: id, uid: result.value, csrf_token: csrf_token }, function (res) {
          if (res.code === 1) { toastOk(res.msg || '修改成功'); loadUsed(); loadStats(); }
          else { toastErr(res.msg || '修改失败'); }
        }).fail(function () { toastWarn('服务异常'); });
      });
    }

    function editUsedPass(id) {
      Swal.fire({
        title: '修改授权密码',
        input: 'text',
        inputValue: '',
        inputPlaceholder: '请输入新授权密码',
        showCancelButton: true,
        confirmButtonText: '保存',
        cancelButtonText: '取消'
      }).then(function (result) {
        if (!result.isConfirmed) return;
        $.post('/index.php?s=/{$app}/gm/cdkUpdatePass', { id: id, pass: (result.value || '').trim(), csrf_token: csrf_token }, function (res) {
          if (res.code === 1) { toastOk(res.msg || '修改成功'); loadUsed(); }
          else { toastErr(res.msg || '修改失败'); }
        }).fail(function () { toastWarn('服务异常'); });
      });
    }

    function deleteUsedCdk(id) {
      Swal.fire({
        title: '确定删除该记录？',
        text: '此操作不可恢复',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        confirmButtonText: '删除',
        cancelButtonText: '取消'
      }).then(function (result) {
        if (!result.isConfirmed) return;
        $.post('/index.php?s=/{$app}/gm/cdkDelete', { id: id, csrf_token: csrf_token }, function (res) {
          if (res.code === 1) {
            toastOk(res.msg || '删除成功');
            if (usedPage > 1 && $('#usedTableBody tr').length <= 1) { usedPage--; }
            loadUsed(); loadStats();
          } else { toastErr(res.msg || '删除失败'); }
        }).fail(function () { toastWarn('服务异常'); });
      });
    }

    // ===== 生成 =====
    $('#cdkGenerateForm').on('submit', function (e) {
      e.preventDefault();
      var $form = $(this);
      var $btn = $form.find('button[type="submit"]');
      if ($btn.prop('disabled')) return;
      $btn.prop('disabled', true);
      $.post('/index.php?s=/{$app}/gm/cdkGenerate', $form.serialize(), function (res) {
        if (res.code === 1) {
          $('#generateResult').text(res.msg || '生成成功').show();
          toastOk(res.msg || '生成成功');
          loadStats();
        } else { toastErr(res.msg || '生成失败'); }
      }).fail(function () { toastWarn('服务异常'); })
        .always(function () { $btn.prop('disabled', false); });
    });

    // ===== CSV 下载 =====
    function collectTable(tbodySel, headers) {
      var data = [headers];
      $(tbodySel).find('tr').each(function () {
        var row = [];
        $(this).find('td').each(function () { row.push($(this).text().trim()); });
        if (row.length) data.push(row);
      });
      return data;
    }

    function triggerCsv(filename, rows) {
      var csv = rows.map(function (r) {
        return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
      }).join('\r\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    $('#downloadQuery').on('click', function () {
      var rows = collectTable('#queryTableBody', ['ID', 'CDK', '等级', '区服', '角色', '使用时间', '授权密码', '状态']);
      if (rows.length <= 1) { toastWarn('无数据可下载'); return; }
      triggerCsv('查询结果.csv', rows);
    });

    $('#downloadUnused').on('click', function () {
      var pageSize = 100;
      $.get('/index.php?s=/{$app}/gm/cdkListUnused&page=1&pageSize=' + pageSize, function (res) {
        if (!(res && res.code === 1)) { toastWarn('服务异常'); return; }
        var totalPages = (res.data && res.data.totalPages) || 0;
        if (totalPages <= 0) { toastWarn('无数据可下载'); return; }
        var rows = [['ID', 'CDK', '等级(lv)']];
        var p = 1;
        (function fetchNext() {
          if (p > totalPages) { triggerCsv('未使用CDK.csv', rows); return; }
          $.get('/index.php?s=/{$app}/gm/cdkListUnused&page=' + p + '&pageSize=' + pageSize, function (r) {
            var list = (r && r.data && r.data.list) ? r.data.list : [];
            for (var i = 0; i < list.length; i++) { rows.push([list[i].id || '', list[i].cdk || '', list[i].lv || '']); }
            p++; fetchNext();
          }).fail(function () { toastWarn('服务异常'); });
        })();
      }).fail(function () { toastWarn('服务异常'); });
    });

    // ===== 初始化 =====
    updatePager('query', 0, 0, 0);
    updatePager('unused', 0, 0, 0);
    updatePager('used', 0, 0, 0);
    loadStats();
  </script>
</body>

</html>
