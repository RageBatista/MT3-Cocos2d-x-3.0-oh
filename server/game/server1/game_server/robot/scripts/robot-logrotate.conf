# robot trace.log logrotate configuration
# Deploy path (Linux): /etc/logrotate.d/robot
# Or run manually: logrotate -f scripts/robot-logrotate.conf
#
# Rotates trace.log when it exceeds 50 MB, keeps 7 days of archives.
# Designed for long-running robot processes that are not restarted daily.

/home/game/server1/game_server/robot/trace.log {
    # Rotate when file exceeds 50 MB
    size 50M

    # Keep 7 rotated copies
    rotate 7

    # Compress rotated files (saves ~90% space for text logs)
    compress
    delaycompress

    # Do not error if log file is missing
    missingok

    # Do not rotate if empty
    notifempty

    # Copy and truncate instead of moving (process keeps file handle open)
    copytruncate

    # Append date suffix to rotated file: trace.log-20260404
    dateext
    dateformat -%Y%m%d

    # Post-rotate: log the event for audit trail
    postrotate
        echo "[logrotate] robot trace.log rotated at $(date '+%Y-%m-%dT%H:%M:%S')" \
            >> /home/game/server1/game_server/robot/scripts/logrotate-audit.log 2>/dev/null || true
    endscript
}

/home/game/server1/game_server/robot/logs/robot-bootstrap.out {
    size 20M
    rotate 5
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
}
