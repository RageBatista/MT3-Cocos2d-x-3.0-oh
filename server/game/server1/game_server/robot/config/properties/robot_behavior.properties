# 机器人行为策略配置（由 robot.ConfigMgr 加载）
# 文件：config/properties/robot_behavior.properties
# 说明：
# - 本文件中的键值会在进程启动时读取。
# - 如运行环境对 Properties 编码敏感，请确保文件以 UTF-8 保存。

# 帮派任务参数（预留/部分启用）
clan.task.action_interval_ms=30000
clan.task.kick_member_rate=0.4

# 帮派副本参数（预留/部分启用）
clan.copy.time_delay_ms=2000

# 移动/战斗参数（预留/部分启用）
move.battle.change_map_delay_ms=5000

# GM 命令开关：
# true  = 允许使用 GM 命令（更适合快速搭建/压测）
# false = 禁用 GM 命令（更接近真实玩家行为）
robot.use_gm_commands=true
# 当 GM 被禁用时，在登录入口直接拦截这些任务类型，
# 避免任务启动后以不可预期方式失败
robot.gm.disabled.blocked_task_types=2,5,6,7,9,10,11,12,16,18,19,20,21,22,23,24,27,28,29,30,31,32,33,34,35

# 机器人状态存储命名空间：
# - robot.storage.namespace：显式覆盖运行态隔离命名空间
# - robot.storage.merge_group：合服/并服分组键
# 空值时回退到 sys.properties 里的 serverid
robot.storage.namespace=
robot.storage.merge_group=

# 挂机权限自动授权（测试服）：
# - 自动补齐服务端挂机校验需要的称号条件（SCommon 655/657）
# - 支持可选的角色等级过滤
robot.guaji.auth.enable=true
robot.guaji.auth.role_ids=
robot.guaji.auth.level_threshold=72
robot.guaji.auth.required_title_ids=705,706,707,708
robot.guaji.auth.offline_title_ids=709,710
robot.guaji.auth.valid_seconds=315360000
robot.guaji.auth.title_name=robot_auth
robot.guaji.auth.hide_title_in_scene=true

# Trace 开关（需要详细排障时开启）
robot.trace.protocol.enable=true
robot.trace.state.enable=true
robot.trace.gm.enable=true
# 协议发送被拦截时的告警节流窗口（毫秒），0 表示每次都记录
robot.protocol.send.blocked_log_interval_ms=3000
# checkmove 保护参数：
# - interval_ms：单角色最小发送间隔（对齐服务端 MoveUnit.CHECK_INTERVAL=250，留 10ms 余量）
# - max_step_pixels：每步最大像素位移（默认=MOVE_SPEED×GRID_TO_PIXEL=768，留空自动推导）
# - max_drift_pixels：相对服务端同步坐标的最大漂移（默认=2×MOVE_SPEED×GRID_TO_PIXEL=1536，留空自动推导）
robot.checkmove.interval_ms=260
#robot.checkmove.max_step_pixels=768
#robot.checkmove.max_drift_pixels=1536

# 关键协议白名单扩展（使用逗号分隔的简单类名）。
# 内置关键协议始终不会被溢出淘汰。
robot.protocol.critical.whitelist=

# 复合玩家模拟（taskType=36）
# 主场景切片时长（秒）
composite.player.sim.slice_seconds=60
# 主轮转场景（逗号分隔）
composite.player.sim.tasks=zhuxian,team,combat,stall,equip,chat,friends,clan,move
# 后台常驻场景（当前仅支持 chat、friends）
composite.player.sim.background_tasks=chat,friends
# 附加到 slice_seconds 的随机抖动，范围为 [-jitter,+jitter]
composite.player.sim.switch_jitter_seconds=20
# 避免相邻切片选择相同场景
composite.player.sim.no_repeat=true
# GM 禁用时，低于该等级不进入诛仙
composite.player.sim.zhuxian_min_level_no_gm=20
# GM 禁用时，从主轮转中移除这些场景
composite.player.sim.gm_disabled_skip_tasks=arena,bingfeng,zhuogui,shilian,treasure,redpacket,clan,circle,zhuxian,spotcard,ride

# ChatLite（供 CompositePlayerSim 后台场景使用）
chat.lite.interval_ms=30000
chat.lite.messages=hello|daily run|any team?|market check|back to game
chat.policy.cooldown_ms=30000
chat.policy.dedup_window_ms=300000
chat.policy.current.enable=true
chat.policy.current.weight=55
chat.policy.current.cooldown_ms=15000
chat.policy.team.enable=true
chat.policy.team.weight=15
chat.policy.team.cooldown_ms=20000
chat.policy.world.enable=true
chat.policy.world.weight=30
chat.policy.world.cooldown_ms=60000
chat.policy.raw.current.enable=true
chat.policy.raw.team.enable=true
chat.policy.raw.world.enable=true
chat.policy.current.disabled_sources=
chat.policy.team.disabled_sources=
chat.policy.world.disabled_sources=
chat.policy.current.fixed_sources=
chat.policy.team.fixed_sources=
chat.policy.world.fixed_sources=buyandsell,chatitem
chat.policy.current.source_weights=loginrole:100,chatlite:70,movebattle:35
chat.policy.team.source_weights=chatlite:25,movebattle:35
chat.policy.world.source_weights=movebattle:45
chat.policy.current.context_weights=solo:60,team:35,battle:10
chat.policy.team.context_weights=team:45,battle:25
chat.policy.world.context_weights=battle:65
chat.policy.adaptive.enable=true
chat.policy.adaptive.min_samples=3
chat.policy.adaptive.skip_percent_threshold=60
chat.policy.adaptive.penalty_percent=35
chat.policy.adaptive.explicit_downgrade_enable=true
chat.policy.adaptive.source_mute.enable=true
chat.policy.adaptive.source_mute.min_samples=6
chat.policy.adaptive.source_mute.skip_percent_threshold=85
chat.policy.adaptive.source_throttle.enable=true
chat.policy.adaptive.source_throttle.min_samples=4
chat.policy.adaptive.source_throttle.skip_percent_threshold=70
chat.policy.adaptive.source_throttle.cooldown_multiplier=3
chat.policy.raw.current.disabled_sources=
chat.policy.raw.team.disabled_sources=
chat.policy.raw.world.disabled_sources=
chat.item.enable=true
chat.item.interval_ms=60000
chat.item.sample_size=20
chat.item.add_hyd_on_send=true

# 安全集市自动购买（BuyAndSell）
market.buy.enable=true
market.buy.whitelist.item_types=1,3
market.buy.whitelist.item_ids=
market.buy.max_per_round=1
market.buy.cooldown_ms=15000
market.buy.min_remain_gold=300000
market.buy.max_price.item=150000
market.buy.max_price.pet=0
market.buy.max_price.equip=300000
market.buy.prefer_equip_score=true

# 装备成长流程（EquipProgressTask）
equip.auto.enable=true
equip.auto.interval_ms=30000
equip.auto.prefer_score=true
equip.progress.enable=true
equip.progress.require_material_check=true
equip.progress.interval_ms=180000
equip.progress.failure_backoff_ms=600000
equip.progress.timeout_ms=20000
equip.progress.min_role_level=30
equip.progress.make_type=1
equip.progress.whitelist_item_ids=

# 自主任务编排（taskType=37）
# 总开关。当前联调/压测场景需要开启。
autonomy.enable=true
# 真实玩家成长链：
# - 开启后，按“主线 -> 穿装 -> 固定4人补队 -> 满队抓鬼”推进
# - quest_until_level 之前禁止切入战斗/抓鬼主目标
autonomy.progression.real_player_chain.enable=true
autonomy.progression.quest_until_level=35
autonomy.goal.switch_interval_ms=60000
autonomy.goal.max_retry=3
autonomy.goal.phase.novice_max_level=25
autonomy.goal.phase.growth_max_level=55
autonomy.goal.phase.equip_min_level=30
autonomy.scenario.move.enable=true
autonomy.scenario.combat.enable=true
autonomy.scenario.equip.enable=true
autonomy.scenario.quest.enable=true

# 组队协同占位配置（P1/P2）
autonomy.team.enable=true
autonomy.team.size=4
# 固定4人满队后才允许进入抓鬼/组队战斗；缺人时持续补队，不降级成3人队
autonomy.team.require_full_team_for_combat=true
autonomy.team.rebuild_timeout_ms=45000
autonomy.team.coordinator_enable=true
autonomy.team.coordinator_action_cooldown_ms=5000

# 战斗与移动安全占位配置
autonomy.combat.auto_battle=true
autonomy.combat.round_timeout_ms=15000
autonomy.combat.prefer_zhuogui.enable=true
autonomy.combat.prefer_zhuogui.min_level=35
autonomy.combat.prefer_zhuogui.require_team=true
autonomy.move.max_drift_pixels=320
autonomy.move.resync_cooldown_ms=5000
autonomy.metrics.log_interval_ms=15000
autonomy.zhuogui.coordinator_enable=true
autonomy.zhuogui.team_action_cooldown_ms=5000
autonomy.zhuogui.quest_request_interval_ms=5000
autonomy.zhuogui.recovery_timeout_ms=300000
autonomy.quest.chain.enable=true
autonomy.quest.chain.slice_ms=180000
autonomy.quest.chain.stall_switch_ms=60000
autonomy.quest.zhuxian_prefer_level=35
autonomy.quest.circle_min_level=20

# 重连退避参数（秒）
robot.auth.timeout_seconds=15
robot.reconnect.delay_seconds=30
robot.reconnect.kicked_delay_seconds=120
robot.reconnect.net_fail_delay_seconds=60
robot.reconnect.quick_close_delay_seconds=180
robot.reconnect.min_interval_seconds=20
robot.reconnect.jitter_seconds=8
robot.reconnect.max_delay_seconds=600

# 任务强制重连阈值
robot.task.circle.force_reconnect.timeout_ms=120000
robot.task.circle.force_reconnect.max_same_point=10
robot.task.zhuxian.force_reconnect.timeout_ms=120000
robot.task.zhuxian.force_reconnect.max_same_point=10

# 进世界重复保护窗口（秒）
robot.enter_world.duplicate_window_seconds=10

# 帮派交互参数（预留）
clan.interact.creator_index=1
clan.interact.create_min_level=30

# 事件指标聚合（P1）
# 将机器人侧结构化事件聚合为窗口计数
autonomy.metrics.aggregate.enable=true
autonomy.metrics.aggregate.interval_ms=60000
autonomy.metrics.aggregate.dimension_top_n=20
# tail gs.log 以摄取服务端 event=* 遥测（例如 guaji_target_switch）
autonomy.metrics.aggregate.server_log.enable=true
autonomy.metrics.aggregate.server_log.path=../gs.log
autonomy.metrics.aggregate.server_log.path_fallback=../../../../../centos_mhxy/home/game/server1/game_server/gs.log
autonomy.metrics.aggregate.server_log.poll_ms=5000
autonomy.metrics.aggregate.server_log.max_lines_per_poll=2000
