# Robot auto bootstrap profile
# Used by: robot/start_robot_profile.sh and game_server/start.sh

# master switch
robot.auto.enable=true

# login batch
robot.auto.server_ip=127.0.0.1
robot.auto.port=42001
robot.auto.start_index=1
robot.auto.count=500
robot.auto.account_prefix=mt3robot
robot.auto.task_type=37
robot.auto.delay_seconds=30

# logging / password
robot.auto.trace_level=INFO
robot.auto.trace_file=trace.log
robot.auto.password=
robot.auto.mkdb_enable=true
robot.auto.no_clean_log=0

# precheck/sync
robot.auto.sync_auto=1
robot.auto.sync_mode=minimal
