[LinkServer]
type            = tcp
port            = 42001
address         = 0.0.0.0
listen_backlog  = 10

# 缓冲区
so_sndbuf       = 16384
so_rcvbuf       = 16384
ibuffermax      = 65536
obuffermax      = 65536
accumulate      = 131072	 

# 检查会话状态超时（默认不检查，状态超时在gnet.link.xml中定义）
session_state_check	= 1
# 检查KeepAlive（默认不检查），当在keepalive_interval时间内未收到客户端的KeepAlive时链接将关闭（LinkBroken's reason=7）（单位为秒）
keepalive_open		= 1
keepalive_interval 	= 30

# 当出现 errcode=2 或 errcode=3 时，IP 封禁时长（单位：秒）
forbid_ip_interval 	= 10

# 检查未知协议类型和大小
checkunknownprotocol	= 0

# gs控制链接开启监听端口，1：链接自己开启端口
listen_port_open	= 1

# 开启协议统计，默认不开启
stat_open		= 0

# 登录和登出日志级别，mengzhu为15，yitian为11，默认为15
log_level		= 6
;log_level		= 15

# 用户数量控制 - 增强用户连接处理能力
max_users		=	10000      # 增加最大用户数，原值10000
halflogin_users 	=	3000       # 增加半登录用户数，原值3000

# 杂项 - 性能优化配置
tcp_nodelay      = 1
close_discard    = 1
urgency_support  = 1
;so_broadcast     = 1

version	  = 16777228

[ProviderServer]
type            = tcp
port            = 43001
address         = 127.0.0.1
listen_backlog  = 10

# 零为保留值
linkid          = 5019

# 缓冲区 - 增强缓冲区配置以处理高频请求
so_sndbuf       = 16384
so_rcvbuf       = 16384
ibuffermax      = 1638400
obuffermax      = 1638400
accumulate      = 131072


[DeliveryClient]
type         	  = tcp
port 		  = 44001 
address           = 127.0.0.1

# 缓冲区
so_sndbuf       = 16384
so_rcvbuf       = 16384
ibuffermax      = 1638400
obuffermax      = 1638400
accumulate      = 131072

# 加密配置
;isec             = 2
;iseckey          = 123
;osec             = 2
;oseckey          = 456

[SpeedLimit]
window		  =  10
high		  =  3

[LogClientManager]
type         	  = udp
port 		  = 11100 
address           = 127.0.0.1

# 缓冲区
so_sndbuf       = 65536
so_rcvbuf       = 65536
ibuffermax      = 65536
obuffermax      = 1048576
accumulate      = 1048576

[LogClientTcpManager]
type         	  = tcp
port 		  = 11101 
address           = 127.0.0.1

# 缓冲区
so_sndbuf       = 65536
so_rcvbuf       = 65536
ibuffermax      = 65536
obuffermax      = 1048576
accumulate      = 1048576
